name: GitHub Readme YouTube Cards

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-readme:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate YouTube Cards
        uses: yuzoKe/github-readme-youtube-cards@main
        with:
          channel_id: "UC_-gj2vjlVcrANxRC0r54VQ"

      - name: Remove YouTube publication dates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("README.md")
          content = path.read_text(encoding="utf-8")

          pattern = r"(?:&amp;|&)timestamp=\d+"
          updated = re.sub(pattern, "", content)

          removed = len(re.findall(pattern, content))

          print(f"Timestamps found: {removed}")

          if removed:
              path.write_text(updated, encoding="utf-8")
              print("YouTube publication dates removed successfully.")
          else:
              print("No timestamps found in README.md.")
          PY

      - name: Commit README without publication dates
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "No README changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "docs: hide YouTube publication dates"
          git push
