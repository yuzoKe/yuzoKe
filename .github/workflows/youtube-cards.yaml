name: GitHub Readme YouTube Cards

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate YouTube Cards
        uses: yuzoKe/github-readme-youtube-cards@main
        with:
          channel_id: "UC_-gj2vjlVcrANxRC0r54VQ"
